name: Build Anatomy R1-1.0.1 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Anatomy R1-1.0.1 Overlay & TCM Data
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Clone Dual-Sex Open-Source Base & Run R1-1.0.1 Assembler
        run: |
          rm -rf /tmp/atlas-r2 /tmp/zh-bp3d
          git clone --depth 1 https://github.com/slorksmo/Human-Atlas.git /tmp/atlas-r2
          git clone --depth 1 https://github.com/jixiangying/anatomy.git /tmp/zh-bp3d || true
          python3 r2/assemble_r1_0_1.py

      - name: Typecheck, Bundle & Build Signed Anatomy R1-1.0.1 APK
        run: |
          cd /tmp/atlas-r2
          npm ci --legacy-peer-deps
          npx tsc --noEmit
          npm run build
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          cat > capacitor.config.ts << 'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.tcm.anatomy3d',
            appName: 'Anatomy R1-1.0.1',
            webDir: 'dist',
            android: { allowMixedContent: true }
          };
          export default config;
          EOF
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          APK_RAW=app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          keytool -genkeypair -v -keystore /tmp/tcm_release.jks -alias tcm3d -keyalg RSA -keysize 2048 -validity 10000 -storepass tcm3dpass -keypass tcm3dpass -dname "CN=Anatomy R1-1.0.1, OU=Medical, O=OpenSource, L=Beijing, S=BJ, C=CN"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK_RAW" /tmp/app-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks /tmp/tcm_release.jks --ks-key-alias tcm3d --ks-pass pass:tcm3dpass --key-pass pass:tcm3dpass --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$APK_RAW" /tmp/app-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK_RAW"
          ls -lh "$APK_RAW"

      - name: Upload Signed Anatomy R1-1.0.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Anatomy-R1-1.0.1-apk
          path: /tmp/atlas-r2/android/app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
