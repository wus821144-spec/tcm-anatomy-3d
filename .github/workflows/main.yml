name: Build Industrial 3D Anatomy APK (v7)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Normalize Uploaded File Paths
        run: |
          mkdir -p src www/data
          [ -f app.js ] && mv -f app.js src/app.js || true
          [ -f index.html ] && mv -f index.html www/index.html || true
          [ -f anatomy_tcm_data.json ] && mv -f anatomy_tcm_data.json www/data/anatomy_tcm_data.json || true
          [ -f tcm_medical_kb.json ] && mv -f tcm_medical_kb.json www/data/tcm_medical_kb.json || true
          ls -la src/ www/ www/data/ scripts/
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Blender 4.2 LTS (Headless)
        run: |
          curl -sL https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz -o blender.tar.xz
          tar -xf blender.tar.xz
          mv blender-4.2.3-linux-x64 /tmp/blender
          echo "/tmp/blender" >> $GITHUB_PATH

      - name: Fetch Z-Anatomy, Female Skeleton Reference & Open Acupoint Repo
        run: |
          git clone --depth 1 https://github.com/Z-Anatomy/Models-of-human-anatomy.git /tmp/z-anatomy
          cd /tmp/z-anatomy
          git lfs pull || true
          unzip -q Z-Anatomy.zip -d /tmp/z-anatomy-extracted
          BLEND_FILE=$(find /tmp/z-anatomy-extracted -name "*.blend" | head -n 1)
          echo "Found BLEND_FILE: $BLEND_FILE"
          test -n "$BLEND_FILE"
          echo "BLEND_FILE=$BLEND_FILE" >> $GITHUB_ENV

          # Optional: Fetch open-source GuanXue acupoint reference assets
          git clone --depth 1 https://github.com/aicuc/3d-acupoint-atlas.git /tmp/guanxue || true
          mkdir -p www/data/ext_acupoints
          if [ -d "/tmp/guanxue" ]; then
            find /tmp/guanxue -maxdepth 3 -name "*.json" -exec cp {} www/data/ext_acupoints/ \; || true
          fi

      - name: Process & Split Z-Anatomy into 6 Region GLBs + TA2 Mesh Index
        run: |
          mkdir -p www/models
          sed -i 's/export_draco_mesh_compression_enable=True/export_draco_mesh_compression_enable=False/g' scripts/split_z_anatomy_regions.py
          sed -i 's/if any(c in combined for c in \["ui", "menu", "labels", "reference", "planes", "annotations", "text"\]):/if any(c in {"ui", "menu", "labels", "annotations", "reference lines", "planes"} for c in col_names):/g' scripts/split_z_anatomy_regions.py
          sed -i 's/if any(b in combined for b in BAD_NAME_KWS):/if any(b in low for b in ["_label", "text_label", "arrow", "gizmo", "widget", "bounding_box", "backdrop", "background", "floor", "stage", "cursor", "pointer", "cross_section", "diagram", "enlargement", "inset", "legend", "ui_", "_ui"]):/g' scripts/split_z_anatomy_regions.py
          sed -i 's/if len(skin_objs) < 5 and len(bpy.data.objects) > 10:/if len(bpy.data.objects) > 10:/g' scripts/split_z_anatomy_regions.py
          sed -i 's/remesh.voxel_size = 0.0085/remesh.voxel_size = 0.0065/g' scripts/split_z_anatomy_regions.py
          python3 -c 'p="scripts/split_z_anatomy_regions.py";t=open(p).read();s="index_file = os.path.join";c="for o in list(bpy.data.objects):\n    if o.type==\"MESH\" and o.data:\n        for pl in o.data.polygons: pl.use_smooth=True\n        if 200<=len(o.data.polygons)<=20000 and not o.name.startswith(\"Skin__\"):\n            try:\n                m=o.modifiers.new(name=\"Sub1\",type=\"SUBSURF\");m.levels=1;m.render_levels=1;bpy.context.view_layer.objects.active=o;bpy.ops.object.modifier_apply(modifier=m.name)\n            except Exception: o.modifiers.clear()\n\n";open(p,"w").write(t.replace(s,c+s,1))'
          blender --background "$BLEND_FILE" --python-exit-code 1 --python scripts/split_z_anatomy_regions.py -- www/models
          ls -lh www/models/*.glb

      - name: Bundle Offline Web Assets & Draco Decoder
        run: |
          npm install
          sed -i 's/const size = 256;/const size = 1024;/g' src/engine_3d.js
          sed -i 's/const size = 128;/const size = 512;/g' src/engine_3d.js
          sed -i 's/tex.repeat.set(4, 4);/tex.repeat.set(4, 4); tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());/g' src/engine_3d.js
          python3 -c 'p="src/engine_3d.js";t=open(p).read();t=t.replace("renderer.outputColorSpace = THREE.SRGBColorSpace;","renderer.outputColorSpace = THREE.SRGBColorSpace;\n  renderer.shadowMap.enabled = true;\n  renderer.shadowMap.type = THREE.PCFSoftShadowMap;");t=t.replace("dir1.position.set(2, 3, 2.5);","dir1.position.set(2, 3, 2.5);\n  dir1.castShadow = true;\n  dir1.shadow.mapSize.set(1024, 1024);\n  dir1.shadow.bias = -0.0005;");t=t.replace("if (!mesh.isMesh || !mesh.material) return;","if (!mesh.isMesh || !mesh.material) return;\n    if (mesh.geometry && !mesh.geometry.attributes.uv && mesh.geometry.attributes.position) { const pos = mesh.geometry.attributes.position; const uvs = new Float32Array(pos.count * 2); for (let i = 0; i < pos.count; i++) { uvs[i*2] = (pos.getX(i) + pos.getZ(i)) * 2.5; uvs[i*2+1] = pos.getY(i) * 2.5; } mesh.geometry.setAttribute(\"uv\", new THREE.BufferAttribute(uvs, 2)); }");t=t.replace("sheen: 0.35, sheenColor: new THREE.Color(0xffedd5),","sheen: 0.55, sheenColor: new THREE.Color(0xffedd5), thickness: 0.35, attenuationColor: new THREE.Color(0xff7b6b),");t=t.replace("if (oldMat && oldMat.dispose) oldMat.dispose();","if (sys !== \"Skin\") { mesh.castShadow = true; mesh.receiveShadow = true; }\n    if (oldMat && oldMat.dispose) oldMat.dispose();");open(p,"w").write(t)'
          python3 -c 'p="src/engine_3d.js";t=open(p).read();t=t.replace("dir1.shadow.bias = -0.0005;","dir1.shadow.bias = -0.0004; dir1.shadow.camera.left=-1.1; dir1.shadow.camera.right=1.1; dir1.shadow.camera.top=1.9; dir1.shadow.camera.bottom=-0.2; dir1.shadow.camera.near=0.5; dir1.shadow.camera.far=6.0; dir1.shadow.camera.updateProjectionMatrix();");t=t.replace("controls.dampingFactor = 0.08;","controls.dampingFactor = 0.14;");t=t.replace("avg < 34 && !_fpsDegraded","avg < 30 && !_fpsDegraded");t=t.replace("state.physAnimEnabled = false;","state.physAnimEnabled = false; renderer.shadowMap.enabled = false;");t=t.replace("state.physAnimEnabled = true;","state.physAnimEnabled = true; renderer.shadowMap.enabled = true;");t=t.replace("while (state.regionOrder.length > 4)","while (state.regionOrder.length > 3)");open(p,"w").write(t)'
          python3 -c 'p="src/mobile_adapter.js";t=open(p).read();t=t.replace("renderer.setPixelRatio(1.0);","renderer.setPixelRatio(1.0); renderer.shadowMap.enabled = false;");t=t.replace("applyEcoMode(renderer, !!getIsEco());","applyEcoMode(renderer, !!getIsEco()); renderer.shadowMap.enabled = true;");open(p,"w").write(t)'
          python3 -c 'p="src/tcm_meridian_engine.js";t=open(p).read();fn="\nexport function snapAcupointsToBodySurface(pm, ag){\n  if(!pm||!pm.length||!ag)return 0;\n  const ts=[];ag.traverse(c=>{if(c.isMesh&&c.visible)ts.push(c);});\n  if(!ts.length)return 0;\n  const rc=new THREE.Raycaster();let n=0;\n  pm.forEach(m=>{\n    const pt=m.userData&&m.userData.data;if(!pt||!pt.isCatalogMapped)return;\n    const p=m.position,mid=new THREE.Vector3(0,p.y,0),od=new THREE.Vector3(p.x,0,p.z);\n    if(od.lengthSq()<0.0001)od.set(0,0,1);od.normalize();\n    rc.set(mid.clone().addScaledVector(od,0.75),od.clone().negate());\n    const h=rc.intersectObjects(ts,false);\n    if(h.length){m.position.copy(h[0].point).addScaledVector(od,0.004);pt.pos=[+m.position.x.toFixed(3),+m.position.y.toFixed(3),+m.position.z.toFixed(3)];n++;}\n  });return n;\n}\n";open(p,"w").write(t+fn);a="src/app.js";at=open(a).read();at=at.replace("getPairedMeridianInfo }","getPairedMeridianInfo, snapAcupointsToBodySurface }");at=at.replace("engine.refreshVisiblePoints();","engine.refreshVisiblePoints();\n  snapAcupointsToBodySurface(state.pointMeshes, anatomyGroup);"),1;open(a,"w").write(at)'
          npm run bundle
          npm run copy-draco

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Standalone Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          APK_SIZE=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)
          echo "Built APK size: $APK_SIZE bytes"
          if [ "$APK_SIZE" -lt 5000000 ]; then
            echo "ERROR: APK size too small ($APK_SIZE bytes), 3D models may be missing!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcm-anatomy-industrial-v7-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
