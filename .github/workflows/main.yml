name: Build Anatomy R1-1.0.3 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Anatomy R1-1.0.2 Overlay & TCM Data
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Blender for Z-Anatomy Extraction
        run: |
          sudo apt-get update
          sudo apt-get install -y blender unzip
        
      
      - name: Clone Dual-Sex Open-Source Base & Run R1-1.0.2 Assembler
        run: |
          rm -rf /tmp/atlas-r2 /tmp/zh-bp3d
          git clone --depth 1 https://github.com/slorksmo/Human-Atlas.git /tmp/atlas-r2
          git clone --depth 1 https://github.com/jixiangying/anatomy.git /tmp/zh-bp3d || true
          python3 r2/assemble_r1_0_1.py
          
      - name: Clone & Extract Z-Anatomy Real Ligaments & Lymphatic GLBs
        run: |
        rm -rf /tmp/z-anatomy /tmp/z-anatomy-unzipped
        git clone --depth 1 https://github.com/Z-Anatomy/Models-of-human-anatomy.git /tmp/z-anatomy
        mkdir -p /tmp/z-anatomy-unzipped
        unzip -q /tmp/z-anatomy/Z-Anatomy.zip -d /tmp/z-anatomy-unzipped
        BLEND_FILE=$(find /tmp/z-anatomy-unzipped -name "*.blend" | head -n 1)
        echo "Using Z-Anatomy blend: $BLEND_FILE"
        blender --background "$BLEND_FILE" --python r2/extract_z_anatomy.py -- \
            /tmp/atlas-r2/public/models \
            /tmp/z-anatomy/TA2.csv \
            /tmp/atlas-r2/public/data
          ls -lh /tmp/atlas-r2/public/models/z_*.glb /tmp/atlas-r2/public/data/z_meta.json
      
      - name: Typecheck, Bundle & Build Signed Anatomy R1-1.0.2 APK
        run: |
          cd /tmp/atlas-r2
          npm ci --legacy-peer-deps
          npx tsc --noEmit
          npm run build
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          cat > capacitor.config.ts << 'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.tcm.anatomy3d',
            appName: 'Anatomy R1-1.0.3',
            webDir: 'dist',
            android: { allowMixedContent: true }
          };
          export default config;
          EOF
          npx cap add android
          npx cap sync android
          python3 -c 'import re; p="android/app/build.gradle"; s=open(p).read(); s=re.sub(r"versionCode\s+\d+","versionCode 103",s); s=re.sub(r"versionName\s+\"[^\"]*\"","versionName \"1.0.3\"",s); sc="    signingConfigs {\n        release {\n            storeFile file(\x27/tmp/tcm_release.jks\x27)\n            storePassword \x27tcm3dpass\x27\n            keyAlias \x27tcm3d\x27\n            keyPassword \x27tcm3dpass\x27\n            enableV1Signing true\n            enableV2Signing true\n            enableV3Signing true\n        }\n    }\n"; s=re.sub(r"([ \t]*)buildTypes\s*\{",lambda m:sc+m.group(0),s,count=1); s=re.sub(r"(buildTypes\s*\{\s*release\s*\{)",r"\1\n            signingConfig signingConfigs.release",s,count=1); open(p,"w").write(s)'
          cd android
          chmod +x gradlew
          if false; then
          ./gradlew assembleRelease 
          APK_RAW=app/build/outputs/apk/release/app-release-unsigned.apk
          APK_OUT=app/build/outputs/apk/release/Anatomy-R1-1.0.3.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          fi
          cat << 'JKS' | base64 -d > /tmp/tcm_release.jks
          
          JKS
          ./gradlew assembleRelease && APK_RAW=app/build/outputs/apk/release/app-release.apk && ([ -f "$APK_RAW" ] || APK_RAW=app/build/outputs/apk/release/app-release-unsigned.apk) && APK_OUT=app/build/outputs/apk/release/Anatomy-R1-1.0.3.apk && BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1) && cp "$APK_RAW" /tmp/app-cleaned.apk && (zip -d /tmp/app-cleaned.apk "META-INF/com/android/build/gradle/*" "META-INF/*.version" "META-INF/version-control-info.textproto" |"META-INF/services/*" | true) && "$BUILD_TOOLS/zipalign" -f -p 4 /tmp/app-cleaned.apk /tmp/app-aligned.apk && "$BUILD_TOOLS/apksigner" sign --min-sdk-version 21 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --ks /tmp/tcm_release.jks --ks-key-alias tcm3d --ks-pass pass:tcm3dpass --key-pass pass:tcm3dpass --out "$APK_OUT" /tmp/app-aligned.apk && if false; then
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK_RAW" /tmp/app-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --min-sdk-version 21  --ks /tmp/tcm_release.jks --ks-key-alias tcm3d --ks-pass pass:tcm3dpass --key-pass pass:tcm3dpass --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$APK_OUT" /tmp/app-aligned.apk
          fi
          "$BUILD_TOOLS/apksigner" verify --min-sdk-version 21 --verbose "$APK_OUT" | tee /tmp/verify.log
          unzip -l "$APK_OUT" | grep -E "META-INF/.*\.(RSA|EC|DSA|SF)"
          grep -E "Verified using v[123] scheme" /tmp/verify.log
          grep -q "v1 scheme.*: true" /tmp/verify.log && grep -q "v2 scheme.*: true" /tmp/verify.log && grep -q "v3 scheme.*: true" /tmp/verify.log && echo "v1=true, v2=true, v3=true verified"
          ls -lh "$APK_OUT"

      - name: Upload Signed Anatomy R1-1.0.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Anatomy-R1-1.0.3-apk
          path: /tmp/atlas-r2/android/app/build/outputs/apk/release/Anatomy-R1-1.0.3.apk
          compression-level: 0
