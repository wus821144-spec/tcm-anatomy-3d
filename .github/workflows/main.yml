          python3 -c 'h="www/index.html";ht=open(h).read();ht=ht.replace("<button class=\"layer-btn glass on\" data-layer=\"Neurovascular\">神经血管</button>","<button class=\"layer-btn glass on\" data-layer=\"Arterial\">动脉</button>\n      <button class=\"layer-btn glass on\" data-layer=\"Venous\">静脉</button>\n      <button class=\"layer-btn glass on\" data-layer=\"Nervous\">神经</button>\n      <button class=\"layer-btn glass on\" data-layer=\"Lymphatic\">淋巴</button>");ht=ht.replace("<button id=\"btn-restore-dissect\" class=\"btn glass\">恢复剥离</button>","<button id=\"btn-restore-dissect\" class=\"btn glass\">恢复剥离</button>\n          <button id=\"btn-view-back\" class=\"btn glass\">背面</button>");open(h,"w").write(ht);a="src/app.js";at=open(a).read();at=at.replace("syncDetailModeUI();","syncDetailModeUI();\n  const btnBk=document.getElementById(\"btn-view-back\");if(btnBk){let isBack=false;btnBk.addEventListener(\"click\",()=>{isBack=!isBack;btnBk.classList.toggle(\"on\",isBack);const t=controls.target;engine.smoothFlyTo([t.x,t.y,t.z],[t.x,t.y+0.08,t.z+(isBack?-2.1:2.1)]);});}");open(a,"w").write(at)'
