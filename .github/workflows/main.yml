,-0.02);st.rotation.x=0.25;const cb=new THREE.Mesh(new THREE.SphereGeometry(0.09,16,16),new THREE.MeshStandardMaterial({color:0xfda4af}));cb.position.set(0,-0.12,-0.13);microGroup.add(hm,cc,st,cb);\n    }";t=t.replace("      microGroup.add(ring);\n    }","      microGroup.add(ring);\n    }"+ex,1);open(p,"w").write(t)'
